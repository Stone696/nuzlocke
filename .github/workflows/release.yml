name: Release (manual)

# Only a deliberate action on main can publish. A normal merge or docs
# cleanup is never a release. A matching tag is immutable for this workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact new version, matching manifest.json (e.g. 3.0.1-BETA)'
        required: true
        type: string
      confirmation:
        description: 'Type PUBLISH to approve the public GitHub prerelease/release'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nuzlocke-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact commit to release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate explicit version and confirmation
        env:
          VERSION: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          supplied=os.environ["VERSION"]
          assert os.environ["CONFIRM"]=="PUBLISH", "Type PUBLISH to approve release."
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?", supplied), "Invalid version."
          actual=json.load(open("manifest.json",encoding="utf-8"))["version"]
          assert actual==supplied, "manifest.json version does not match chosen release."
          PY
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Release tag v${VERSION} exists; bump version before publishing."
            exit 1
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Release v${VERSION} already exists."
            exit 1
          fi
      - name: Check current release docs and contributor credits
        run: node tests/gen3_docs_gate.js
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Parse-check all runtime Lua and mod metadata
        run: |
          for file in ./*.lua mod.card; do luac5.1 -p "$file"; done
      - name: Re-run every Gen 3 smoke before publishing
        run: bash tests/run_gen3_smoke.sh
      - name: Create minimal reproducible player ZIP
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bash tests/package_gate.sh dist
          (cd dist && sha256sum "nuzlocke-${VERSION}.zip" > sha256sums.txt)
          unzip -l "dist/nuzlocke-${VERSION}.zip"
      - name: Prepare curated release notes instead of commit history
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          source=Path("RELEASE_NOTES.md").read_text(encoding="utf-8")
          current=source.split("\n---\n",1)[0].strip()
          assert "v" in current.splitlines()[0], "Missing versioned release section"
          Path(os.environ["RUNNER_TEMP"],"nuzlocke-notes.md").write_text(
              current+"\n",encoding="utf-8")
          PY
      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$VERSION" == *-* ]]; then extra+=(--prerelease); fi
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "Nuzlocke v${VERSION}" \
            --notes-file "$RUNNER_TEMP/nuzlocke-notes.md" \
            "${extra[@]}" \
            "dist/nuzlocke-${VERSION}.zip" "dist/sha256sums.txt"
